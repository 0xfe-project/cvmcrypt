name: ci

# The gate for cvmcrypt: format, the freestanding audit, and the test suite
# in all four build configurations (debug, release, asan, tsan).
#
# Three platforms, because the SIMD layer is platform-specific:
#   macOS (arm64)   exercises the aarch64 crypto extension path
#   Linux  (amd64)  exercises the SHA-NI path, where cpuid reports SHA
#   Windows (amd64) exercises the same path under a different toolchain
#
# Not turned on yet. This workflow only runs on workflow_dispatch -- it is
# here so the moment the repo is pushed, it is ready. Flip the trigger by
# uncommenting the push/pull_request block below.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # clang-format's output differs between major versions, so the runner
      # has to format with the same major that development does. The fmt
      # step prints the version it used, so a mismatch is visible.
      - name: clang-format
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install clang-format
          else
            sudo apt-get update && sudo apt-get install -y clang-format
          fi

      - name: clang-format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --version=23.1.3 -y

      # The build uses ccache when it finds it. Cached per job and platform
      # with a timestamp so a run always saves a fresh entry and restores
      # from the most recent one.
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.os }}
          max-size: 500M

      # The project has no npm dependencies -- package.json is only a script
      # runner -- so there is nothing to install.
      - name: ci
        run: node scripts/ci.mjs

      # Whether the cache is working is not visible from a green check.
      - name: ccache stats
        if: always() && runner.os != 'Windows'
        run: ccache -s
